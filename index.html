<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets API 連携</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>スプレッドシート連携アプリ</h1>
        
        <!-- 操作ボタン -->
        <div class="button-group">
            <button id="authorize_button" onclick="handleAuthClick()">Googleでログイン</button>
            <button id="signout_button" onclick="handleSignoutClick()" style="display: none;">ログアウト</button>
        </div>

        <!-- 読み込んだデータの表示エリア -->
        <pre id="content"></pre>
    </div>

    <!-- Google 認証 & API ライブラリの読み込み -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    
    <!-- JavaScript本体 -->
    <script src="script.js"></script>
</body>
</html>
