<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード付き足し算アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- パスワード入力画面 -->
        <div id="auth-screen">
            <h2>パスワードを入力</h2>
            <!-- <p style="font-size: 12px; color: #666;">パスワードは「1202」です</p> -->
            <input type="password" id="pass-input" placeholder="****">
            <br>
            <button id="login-btn">送信</button>
            <div id="error-msg" class="error"></div>
        </div>

        <!-- 足し算アプリ画面（最初は隠れている） -->
        <div id="app-screen" class="hidden">
            <h1>かんたん足し算</h1>
            <div class="input-area">
                <input type="number" id="num1" placeholder="数字1">
                <span>＋</span>
                <input type="number" id="num2" placeholder="数字2">
                <button id="calc-btn">＝</button>
            </div>
            <div id="result">結果はここに表示されます</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
