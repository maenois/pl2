<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets ログ管理アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>スプレッドシート ログ管理ツール（GUI版）</h1>
        
        <!-- 認証ボタン -->
        <div class="button-group">
            <button id="authorize_button" onclick="handleAuthClick()">Googleでログイン</button>
            <button id="signout_button" onclick="handleSignoutClick()" style="display: none;">ログアウト</button>
        </div>

        <!-- ログイン後に操作するフォーム（GUI） -->
        <div id="app_section" style="display: none;" class="form-section">
            <div class="input-group">
                <label for="folder_id_input">保存先Googleドライブ フォルダID:</label>
                <input type="text" id="folder_id_input" placeholder="例: 1a2b3c4D5e... (空欄ならマイドライブ直下)">
                <button type="button" onclick="saveFolderId()">フォルダIDを保存</button>
            </div>

            <div class="input-group">
                <label for="sheet_title_input">新しく作るシートの名前:</label>
                <input type="text" id="sheet_title_input" value="カスタムデータシート">
                <button type="button" class="primary-btn" onclick="createNewSheet()">シートを作成してログに記録</button>
            </div>
        </div>

        <!-- 状態を表示するエリア -->
        <div id="content" class="output-box">
            <p>「Googleでログイン」ボタンを押してください。</p>
        </div>

        <!-- 作成されたスプレッドシートを開くためのリンク表示エリア -->
        <div id="links" class="links-box"></div>
    </div>

    <!-- Google 認証 & API ライブラリの読み込み -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    
    <!-- JavaScript本体 -->
    <script src="script.js"></script>
</body>
</html>
