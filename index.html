<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面遷移テスト用アプリ</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google API & Google Identity Services の読み込み -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <!-- Google Picker API の読み込み -->
    <script type="text/javascript" src="https://apis.google.com/js/picker.js"></script>
</head>
<body>

    <div class="container">
        <!-- パスワード認証セクション -->
        <div id="password_section" class="card">
            <h2>パスワード認証</h2>
            <p>利用するにはパスワードを入力してください（初期値: 1202）。</p>
            <input type="password" id="password_input" placeholder="パスワード">
            <button onclick="checkPassword()">ログイン</button>
            <p id="password_error" class="error-text"></p>
        </div>

        <!-- メインアプリセクション（初期状態は非表示） -->
        <div id="main_app_content" class="card" style="display: none;">
            <h2>ファイル自動生成システム</h2>

            <!-- フォルダ選択＆Googleログインエリア -->
            <div class="auth-box">
                <div class="folder-select-area">
                    <button onclick="openFolderPicker()" id="folder_picker_button">📁 保存先フォルダを選択</button>
                    <span id="selected_folder_name">未選択（マイドライブ直下）</span>
                </div>
                
                <div class="login-actions">
                    <button id="authorize_button" onclick="handleAuthClick()" style="display: none;" class="btn-google">Googleログイン</button>
                    <button id="signout_button" onclick="handleSignoutClick()" style="display: none;" class="btn-danger">ログアウト</button>
                </div>
            </div>

            <hr>

            <!-- アプリのコンテンツ表示・操作エリア（メニューやフォームがここに切り替わります） -->
            <div id="app_section" style="display: none;">
                <div id="content"></div>
                <div id="links" class="links-area"></div>
            </div>
        </div>
    </div>

    <!-- 外部スクリプトの読み込み -->
    <script src="script.js"></script>
</body>
</html>
