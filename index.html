<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動生成ツール</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google API & Google Identity Services の読み込み -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script type="text/javascript" src="https://apis.google.com/js/picker.js"></script>
</head>
<body>

    <div class="container">
        <!-- 0. パスワード認証セクション -->
        <div id="password_section" class="card">
            <h2>パスワード認証</h2>
            <p>利用するにはパスワードを入力してください。</p>
            <input type="password" id="password_input" placeholder="パスワード">
            <button onclick="checkPassword()" class="btn-blue">ログイン</button>
            <p id="password_error" class="error-text"></p>
        </div>

        <!-- メインアプリセクション -->
        <div id="main_app_content" class="card" style="display: none;">
            <h2>自動生成システム</h2>

            <!-- Googleログインエリア -->
            <div class="auth-box">
                <div class="login-actions">
                    <button id="authorize_button" onclick="handleAuthClick()" style="display: none;" class="btn-google">Googleログイン</button>
                    <button id="signout_button" onclick="handleSignoutClick()" style="display: none;" class="btn-danger">ログアウト</button>
                </div>
            </div>

            <hr>

            <!-- 各画面コンテナ -->
            <div id="app_section" style="display: none;">

                <!-- ① メニュー選択画面 -->
                <div id="view_menu" class="view-screen">
                    <h3>作成するファイルの種類を選んでください</h3>
                    <div class="menu-buttons">
                        <button onclick="switchView('spreadsheet')" class="btn-green">📊 スプレッドシートを作成</button>
                        <button onclick="switchView('word')" class="btn-blue">📄 ワード出力ページへ</button>
                    </div>
                </div>

                <!-- ② スプレッドシート作成入力画面（階層式フォルダブラウザ付き） -->
                <div id="view_spreadsheet" class="view-screen" style="display: none;">
                    <button onclick="switchView('menu')" class="btn-back" style="margin-bottom: 15px;">← メニューに戻る</button>
                    <h3>📊 スプレッドシート作成</h3>
                    
                    <!-- 階層式フォルダブラウザ -->
                    <div class="form-group folder-browser-box">
                        <label>📁 Googleドライブ保存先フォルダの選択:</label>
                        
                        <!-- パンくずリスト（現在地） -->
                        <div id="breadcrumb_container" class="breadcrumb-trail">
                            <span class="breadcrumb-item" onclick="navigateToFolder('root', 'マイドライブ')">マイドライブ</span>
                        </div>

                        <!-- フォルダ一覧リスト -->
                        <div id="folder_list_container" class="folder-list-box">
                            <p style="color: #666; font-size: 13px; text-align: center;">フォルダを読み込んでいます...</p>
                        </div>

                        <!-- 現在選択中の保存先表示 ＆ 決定ボタン -->
                        <div class="selected-folder-action">
                            <button onclick="confirmCurrentFolder()" class="btn-green">📌 このフォルダを保存先に決定</button>
                            <span id="target_folder_display" class="target-display">選択中: マイドライブ</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>スプレッドシート名:</label>
                        <input type="text" id="sheet_title_input" value="カスタムデータシート">
                    </div>
                    <div class="form-group">
                        <label>シート名（カンマ区切り）:</label>
                        <input type="text" id="sheet_names_input" value="集計用">
                    </div>
                    <button onclick="createNewSheet()" class="btn-green" style="width: 100%;">スプレッドシートを自動生成する</button>
                </div>

                <!-- ③ ワード出力画面 -->
                <div id="view_word" class="view-screen" style="display: none;">
                    <button onclick="switchView('menu')" class="btn-blue" style="margin-bottom: 15px;">← メニューに戻る</button>
                    <h1 class="hello-world-text">Hello World</h1>
                    <p class="sub-text">（ここに今後、スプレッドシートを読み込んでWord形式で出力する機能が入ります）</p>
                </div>

                <!-- 処理結果・リンク表示エリア -->
                <div id="content" class="content-msg"></div>
                <div id="links" class="links-area"></div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
